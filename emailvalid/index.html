<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <img src="emailpic.svg" alt="iValidate logo">
            </div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <br>
    <br>
    <br>

    <main>
        <div class="container">
            <h1>Check Your Email is Valid or not!!</h1>
            <form id="email-form" novalidate>
                <label for="username">Email:</label>
                <input type="email" id="username" name="username" required placeholder="Enter Your Email...">
                <br><br>
                <button type="submit" id="submit-btn" class="btn">Submit</button>
            </form>
        </div>
        <br>
        <br>
        <br>
        <div class="container">
            <h2>Validation Results</h2>
            <div id="resultcont"></div>
        </div>
    </main>

    <footer>
        iValidate.com | @Copyright | All Right Reserved | 2018
    </footer>

</body>

</html>
